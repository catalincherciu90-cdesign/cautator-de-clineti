name: Deploy pe Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, claude/dreamy-edison-u0c7y1]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalează dependențele
        run: npm ci

      - name: Creează baza D1 (dacă nu există) și setează database_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          DB_NAME=firme-constructii-db
          DB_ID=$(npx wrangler d1 list --json | jq -r ".[] | select(.name==\"$DB_NAME\") | .uuid")
          if [ -z "$DB_ID" ]; then
            echo "Creez baza de date $DB_NAME..."
            npx wrangler d1 create "$DB_NAME"
            DB_ID=$(npx wrangler d1 list --json | jq -r ".[] | select(.name==\"$DB_NAME\") | .uuid")
          fi
          echo "database_id: $DB_ID"
          sed -i "s/PLACEHOLDER_DB_ID/$DB_ID/" wrangler.jsonc

      - name: Inițializează schema bazei de date
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute firme-constructii-db --remote --file=./schema.sql --yes

      - name: Migrare coloana industrie (ignoră eroarea dacă există deja)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute firme-constructii-db --remote --command "ALTER TABLE firme ADD COLUMN industrie TEXT" --yes

      - name: Migrare coloana cui (ignoră eroarea dacă există deja)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute firme-constructii-db --remote --command "ALTER TABLE firme ADD COLUMN cui TEXT" --yes

      - name: Publică aplicația
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Setează cheia tunelului de import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$KEY" | npx wrangler secret put IMPORT_PROXY_KEY

      - name: Setează cheia Google Places în Cloudflare (dacă există)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY
            echo "Cheia Google Places a fost setată."
          else
            echo "GOOGLE_PLACES_API_KEY nu e definit în GitHub Secrets — aplicația folosește doar OpenStreetMap."
          fi

      - name: Test căutare în producție
        continue-on-error: true
        run: |
          sleep 10
          echo "=== Test API firme salvate ==="
          curl -s "https://cautator-firme-constructii.catalincherciu90.workers.dev/api/firms" | head -c 300
          echo
          echo "=== Test căutare Cluj-Napoca ==="
          curl -s "https://cautator-firme-constructii.catalincherciu90.workers.dev/api/search?city=Cluj-Napoca" | head -c 1500
          echo
          echo "=== Test căutare București ==="
          curl -s "https://cautator-firme-constructii.catalincherciu90.workers.dev/api/search?city=Bucuresti" | head -c 800
